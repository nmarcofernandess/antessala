appId: com.antessala.triagem
productName: Antessala
directories:
  buildResources: resources
  output: dist
files:
  - 'out/**/*'
extraResources:
  - from: 'src/data/catalogos/'
    to: 'clinical-data/'
    filter:
      - '**/*'
  - from: 'src/data/knowledge-corpus/'
    to: 'knowledge-corpus/'
    filter:
      - '**/*'
asarUnpack:
  - '**/*.node'
mac:
  icon: icon.icns
  category: public.app-category.business
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: '${productName}-${version}-${arch}.${ext}'
  notarize: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: '/Applications'
    - x: 270
      y: 80
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: '${productName}-Setup-${version}.${ext}'
linux:
  icon: icon.png
  target:
    - AppImage
  category: Office
  artifactName: '${productName}-${version}.${ext}'
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
publish:
  provider: github
  owner: nmarcofernandess
  repo: antessala
