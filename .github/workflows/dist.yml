# Dist (mac + win) — empacotamento por OS, disparo manual (workflow_dispatch).
#
# Herdado do fork e reduzido ao empacotamento do Antessala.
# - Build é AD-HOC (sem assinatura/notarização) — o .app/.exe roda, mas o usuário
#   final verá aviso de Gatekeeper/SmartScreen até existir uma frente de assinatura.
#   Signing = gate futuro (cert Apple Developer ID + cert EV/OV Windows + secrets).
# - STT permanece dormente e não entra neste bundle; os comandos usam somente Node.
# - dist:* usam --publish never (CI só gera artifacts; publicar release é outro fluxo).
name: dist

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, cmd: 'dist:mac' }
          - { os: windows-latest, cmd: 'dist:win' }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix platform-specific rollup binding (Windows)
        if: runner.os == 'Windows'
        run: npm install @rollup/rollup-win32-x64-msvc --no-save

      - name: Package (${{ matrix.cmd }})
        run: npm run ${{ matrix.cmd }}

      - name: List dist output
        shell: bash
        run: ls -la dist/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: warn
