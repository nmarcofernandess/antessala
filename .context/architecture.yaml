  arvore Git nao truncada, entrypoints, rotas, handlers IPC, persistencia, rede,
  empacotamento, STT, knowledge e testes presentes. O commit 316b402 conteve os
  handlers nao publicados; nele passaram 11 testes focados e npm run typecheck.
  Build, aplicacao, E2E e empacotamento nao foram executados.
