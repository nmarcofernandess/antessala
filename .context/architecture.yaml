trust_boundary:
  main_window:
    status: INCOMPLETE
    summary: "A janela isola contexto e desliga Node no renderer, mas permanece sem sandbox."
    evidence:
      - "src/main/index.ts:32-46"
      - "src/renderer/index.html:6-9"
    reuse_boundary: "Manter contextIsolation e nodeIntegration=false; revisar sandbox, navegacao e permissoes antes de dados clinicos reais."
  preload:
    status: INCOMPLETE
    summary: "O preload expoe invoke, on e removeAllListeners genericos, apesar do comentario afirmar allowlist."
    evidence:
      - "src/preload/index.ts:1-17"
    reuse_boundary: "O cliente TIPC pode ser mantido, mas a ponte deve ser estreitada antes de uma fronteira multiusuario."
  authorization:
    status: INCOMPLETE
    summary: "O HEAD nao possui login, sessao, papeis, capabilities nem guards de autorizacao IPC."
    evidence:
      - "src/main/tipc.ts:373-409"
      - "src/main/db/schema.ts:8-24"
    reuse_boundary: "Nao publicar superficies clinicas sobre o router atual sem o contrato de acesso aprovado."

