schema_version: "antessala.workflow-context.v3"

purpose: "Levar o produto aprovado a fatias implementáveis sem deixar hubs apagarem contratos de domínio."

authority:
  order:
    - "Marco e hack/PRD.md aprovado"
    - "Analyst canônico do domínio dono"
    - "Build canônico do domínio dono"
    - "Writing Plan da fatia"
    - "código e testes do HEAD"
    - "hubs e documentação auxiliar"
  conflict_rule: "Parar, reportar e corrigir a fonte canônica. Nunca escolher silenciosamente."
  hubs: "hack/ANALYST.md, hack/analysis.md e hack/BUILD.md são índices/mapas; não são atalhos de leitura."

flow: |
  flowchart LR
      PRD["PRD aprovado"] --> DOMAIN_A["8 Analysts de domínio"]
      DOMAIN_A --> SYNTH["analysis.md hub"]
      SYNTH --> DOMAIN_B["8 Builds de domínio"]
      DOMAIN_B --> BUILD["BUILD.md hub"]
      BUILD --> REVIEW["Review final independente"]
      REVIEW --> WARLOG["Warlog exaustivo"]
      WARLOG --> WP["Writing Plan da fatia"]
      WP --> RED["Primeiro teste TDD em RED"]
      RED --> CODE["Implementação"]
      CODE --> QA["QA da fatia"]
      QA --> MORE{"Outra fatia?"}
      MORE -->|"sim"| WP
      MORE -->|"não"| FINAL["QA final ponta a ponta"]

phases:
  prd:
    owner: "hack/PRD.md"
    state: "APPROVED_PRODUCT_BASELINE"
  analyst:
    owners: "hack/domains/ANALYST-*.md"
    hub: "hack/ANALYST.md + hack/analysis.md"
    meaning: "Cada domínio fecha entidades semânticas, estados, regras, atores, consumidores, falhas e proibições."
  build:
    owners: "hack/domains/BUILD-*.md"
    hub: "hack/BUILD.md"
    meaning: "Cada domínio traduz seu Analyst em tabelas, DTOs, IPC, serviços, transações, componentes e testes."
  review:
    owner: ".context/review/STATUS.md"
    meaning: "Reviewer independente lê PRD, 16 contratos e hubs; aponta incongruências materiais."
  warlog:
    owner: "hack/WARLOG.md"
    create_after_review: true
    executor: "Outra IA, nunca o reconciliador que escreveu os hubs atuais."
    meaning: "Decompõe todos os contratos antes de cortar fatias verticais."
    required_receipts:
      - "source_artifact"
      - "source_section_or_rule"
      - "task_or_explicit_exclusion"
      - "implementation_owner"
      - "proof"
    constraints:
      - "Ler integralmente 8 Analysts e 8 Builds."
      - "Não gerar tarefa apenas de analysis.md ou BUILD.md."
      - "Não limitar quantidade; aproximadamente 1000 tarefas é aceitável se a cobertura exigir."
      - "Provar cobertura reversa de cada MUST, campo, estado, ação, erro, teste e limite de UI."
      - "Cortar fatias somente depois da matriz exaustiva."
  minispec:
    meaning: "Diretório/nome de uma fatia vertical definidos pelo Warlog; não possui spec.md."
    required_file: "hack/minispecs/<id>/writing-plan.md"
  writing_plan:
    meaning: "Plano executável que consome diretamente PRD, contracts de domínio e Warlog."
    required_content:
      - "objetivo vertical e cenário demonstrável"
      - "regras de origem com links"
      - "arquivos exatos"
      - "ordem de implementação"
      - "primeiro teste relevante em RED"
      - "testes e provas por etapa"
      - "rollback ou contenção"
    forbidden: "Redecidir produto, resumir owner com perda ou inventar arquitetura."
  implementation:
    start_condition: "Writing Plan existe e o primeiro teste relevante foi observado em RED."
  qa:
    meaning: "Valida a fatia e, ao final, a jornada integrada ponta a ponta."

research_and_adversarial:
  role: "Subprocessos que corrigem os owners; não geram fonte paralela nem gate individual."
  raw_output_rule: "Resposta externa é material de trabalho, não documentação canônica."

surface_contract:
  analyst_owner: "hack/domains/ANALYST-superficies-e-configuracoes.md"
  build_owner: "hack/domains/BUILD-superficies-e-configuracoes.md"
  future_docs: "Surface Blueprint separado somente se o Writing Plan provar necessidade; não criar agora."

governance:
  individual_signatures: false
  individual_analyst_gates: false
  individual_build_gates: false
  spec_files: false
  plan_approval_gate: false
  evidence_required: true

documentation_minimalism:
  - "Um owner canônico por regra."
  - "Sem Spec duplicando PRD ou Build."
  - "Sem SPRINTS.md paralelo: o Warlog corta as fatias."
  - "Sem relatório bruto de GPT no repositório."
  - "Sem usar hub para dispensar leitura do domínio."
