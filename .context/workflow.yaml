schema_version: "antessala.workflow-context.v2"

purpose: "Levar a PoC do produto aprovado ao código com uma única cadeia canônica e sem gates documentais individuais."

authority:
  order:
    - "Marco e hack/PRD.md aprovado"
    - "hack/analysis.md"
    - "hack/BUILD.md"
    - "Warlog e recorte de minispecs"
    - "Writing Plan da minispec"
    - "código e testes do HEAD"
  conflict_rule: "Parar e corrigir o artefato inferior; nunca escolher silenciosamente."
  domain_appendices: "hack/domains/* preserva detalhe e evidência, mas não possui gate individual nem supera a síntese."

flow: |
  flowchart LR
      PRD["PRD aprovado"] --> ANALYST["analysis.md integrado"]
      ANALYST --> BUILD["BUILD.md integrado"]
      BUILD --> REVIEW["Review final de congruência"]
      REVIEW --> WARLOG["Warlog corta minispecs"]
      WARLOG --> WP["Writing Plan da minispec"]
      WP --> RED["Primeiro teste TDD em RED"]
      RED --> CODE["Implementação"]
      CODE --> QA["QA da minispec"]
      QA --> MORE{"Outra minispec?"}
      MORE -->|"sim"| WP
      MORE -->|"não"| FINAL["QA final ponta a ponta"]

phases:
  prd:
    owner: "hack/PRD.md"
    state: "APPROVED_PRODUCT_BASELINE"
    meaning: "Define problema, goal, atores, fluxo e fronteiras."
  analyst:
    owner: "hack/analysis.md"
    state: "CONSOLIDATED_FOR_BUILD"
    meaning: "Define entidades semânticas, estados, regras, autoridade humana, falhas e proibições."
    appendices: "hack/domains/ANALYST-*.md"
  build:
    owner: "hack/BUILD.md"
    state: "READY_FOR_FINAL_CONGRUENCE_REVIEW"
    meaning: "É a especificação técnica: tabelas, DTOs, IPC, transações, superfícies, componentes e estratégia de prova."
    appendices: "hack/domains/BUILD-*.md"
  review:
    owner: ".context/review/STATUS.md"
    meaning: "Ataque final à congruência PRD → Analyst → BUILD; achado P0 retorna ao artefato canônico."
  warlog:
    owner: "hack/WARLOG.md"
    create_after_review: true
    meaning: "Registra decisões de execução e corta o BUILD em fatias verticais demonstráveis."
  minispec:
    meaning: "Nome e diretório de uma fatia vertical definidos pelo Warlog; não possui spec.md própria."
    required_file: "hack/minispecs/<id>/writing-plan.md"
  writing_plan:
    meaning: "Plano executável derivado diretamente de PRD + analysis.md + BUILD.md + Warlog."
    required_content:
      - "objetivo vertical e cenário demonstrável"
      - "contratos canônicos consumidos"
      - "arquivos exatos a criar ou alterar"
      - "ordem de implementação"
      - "primeiro teste relevante em RED"
      - "testes por etapa"
      - "provas e comandos proporcionais"
      - "rollback ou contenção"
    forbidden: "Não redecidir produto nem arquitetura; divergência volta ao artefato canônico."
  implementation:
    start_condition: "Writing Plan existe e o primeiro teste relevante foi observado em RED."
    method: "Implementar em fatias pequenas, manter verde honesto e registrar desvios no Warlog."
  qa:
    meaning: "Valida comportamento real da fatia e, ao final, a jornada sintética ponta a ponta."

research_and_adversarial:
  role: "Subprocessos usados para melhorar Analyst e BUILD; não são fases nem gates autônomos."
  raw_output_rule: "Resposta externa é material de trabalho, nunca nova fonte canônica."
  final_review: "O GPT Pro revisa o SHA publicado; o chat principal verifica e corrige achados antes do Warlog."

surface_contract:
  owner: "hack/BUILD.md"
  rule: "Rotas, papéis, regiões, DTOs, ações e estados de UI ficam no BUILD integrado e no Build de superfícies como anexo."
  future_docs: "Criar documento separado somente se um Writing Plan provar necessidade; não é gate pré-Warlog."

governance:
  individual_signatures: false
  individual_analyst_gates: false
  individual_build_gates: false
  spec_files: false
  plan_approval_gate: false
  evidence_required: true
  product_change_rule: "Mudança de problema, goal, atores ou fronteira reabre o PRD; correção técnica atualiza Analyst/BUILD e o Warlog."

documentation_minimalism:
  - "Um owner canônico por regra."
  - "Sem Spec duplicando PRD/BUILD."
  - "Sem SPRINTS.md separado: o Warlog corta as minispecs."
  - "Sem Critic placeholder: o review final ocorre sobre o SHA publicado."
  - "Sem relatório bruto de GPT no repositório."
  - "Sem gate ou assinatura por anexo."
