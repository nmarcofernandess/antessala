schema_version: "antessala.context.v2"

identity:
  product: "Antessala"
  purpose: "Diferenciar a necessidade operacional da consulta pré-anestésica e conduzir o caso até o handoff final."
  repository_role: "Prova de conceito Electron local, com dados sintéticos."

entrypoint:
  required: true
  instruction: "Toda IA deve começar aqui antes de afirmar, revisar ou alterar qualquer coisa no Antessala."

mandatory_read_order:
  - order: 1
    paths: [".context/manifest.yaml", "hack/PRD.md"]
    purpose: "Ler a autoridade e o contrato de produto aprovado."
  - order: 2
    paths: ["hack/status.json", "hack/progress.md", ".context/review/STATUS.md"]
    purpose: "Conhecer a fase viva, o último recibo e a próxima ação."
  - order: 3
    paths: [".context/product.yaml", ".context/workflow.yaml", ".context/architecture.yaml"]
    purpose: "Entender produto, método e capacidades comprovadas no HEAD."
  - order: 4
    paths: ["hack/ANALYST.md", "hack/analysis.md"]
    purpose: "Ler a autoridade semântica integrada."
  - order: 5
    path: "hack/domains/ANALYST-*.md"
    purpose: "Consultar evidência e detalhe do domínio sem criar autoridade paralela."
  - order: 6
    path: "hack/BUILD.md"
    purpose: "Ler a especificação técnica integrada."
  - order: 7
    path: "hack/domains/BUILD-*.md"
    purpose: "Consultar detalhe físico; em conflito, o BUILD integrado prevalece."
  - order: 8
    path: "código e testes do HEAD"
    purpose: "Provar a implementação viva antes de afirmar capacidade existente."

canonical_artifacts:
  product_contract: "hack/PRD.md"
  integrated_analysis: "hack/analysis.md"
  integrated_build: "hack/BUILD.md"
  domain_analysts: "hack/domains/ANALYST-*.md"
  domain_builds: "hack/domains/BUILD-*.md"
  execution_state: "hack/status.json"
  progress_receipt: "hack/progress.md"
  review_tracker: ".context/review/STATUS.md"
  future_warlog: "hack/WARLOG.md"
  future_writing_plan: "hack/minispecs/<id>/writing-plan.md"

context_map:
  manifest.yaml: "Entrada, leitura obrigatória e hierarquia de autoridade."
  product.yaml: "Resumo do problema, fluxo, fronteiras e Definition of Done."
  workflow.yaml: "Método da aprovação do PRD até QA."
  architecture.yaml: "Inventário comprovado da arquitetura Electron no HEAD."
  review/STATUS.md: "Único tracker de research, recon e review."

authority:
  levels:
    - order: 1
      source: "Marco e hack/PRD.md aprovado"
    - order: 2
      source: "hack/analysis.md integrado"
    - order: 3
      source: "hack/BUILD.md integrado"
    - order: 4
      source: "Warlog e Writing Plan da minispec ativa"
    - order: 5
      source: "código e testes do HEAD"
    - order: 6
      source: "anexos de domínio e documentação auxiliar"
  conflict_rule: "Pare e reporte as fontes conflitantes. Nunca escolha silenciosamente nem use um anexo para sobrepor seu integrado."

workflow:
  current_phase: "final_congruence_review"
  sequence:
    - "PRD aprovado"
    - "Analyst integrado"
    - "BUILD integrado"
    - "review final de congruência"
    - "Warlog corta minispecs"
    - "writing-plan.md da fatia"
    - "TDD RED"
    - "implementação"
    - "QA"
  no_separate_spec: true
  no_individual_signature_gates: true

limits:
  context_role: ".context organiza o mapa cognitivo; não substitui PRD, Analyst ou BUILD."
  flowkit_warning: "Qualquer CLAUDE, AGENTS, comentário ou documentação herdada do FlowKit é contexto histórico, nunca verdade do Antessala."
  raw_review_rule: "Resposta de GPT é material de trabalho. Corrija o owner canônico e o tracker; não arquive a resposta como fonte de verdade."
  documentation_rule: "Não criar documentação paralela quando já existe um owner canônico para a regra."
