schema_version: "antessala.context.v3"

identity:
  product: "Antessala"
  purpose: "Diferenciar a necessidade operacional da consulta pré-anestésica e conduzir o caso até o handoff final."
  repository_role: "Produto Electron local em construção, demonstrado com dados sintéticos."

entrypoint:
  required: true
  instruction: "Toda IA começa aqui antes de afirmar, revisar ou alterar o Antessala."

mandatory_read_order:
  - order: 1
    paths: [".context/manifest.yaml", "hack/PRD.md"]
    purpose: "Identidade e produto aprovado."
  - order: 2
    paths: ["hack/status.json", "hack/progress.md", ".context/review/STATUS.md"]
    purpose: "Fase viva e maturidade honesta."
  - order: 3
    paths: [".context/product.yaml", ".context/workflow.yaml", ".context/architecture.yaml"]
    purpose: "Produto resumido, método e capacidade comprovada no HEAD."
  - order: 4
    paths: ["hack/ANALYST.md", "hack/analysis.md"]
    purpose: "Índice e mapa integrado; ambos são hubs."
  - order: 5
    path: "hack/domains/ANALYST-*.md"
    purpose: "Ler integralmente cada contrato semântico relacionado; ele é autoridade do domínio."
  - order: 6
    paths: ["hack/BUILD.md"]
    purpose: "Ler o hub técnico e o grafo de dependências."
  - order: 7
    path: "hack/domains/BUILD-*.md"
    purpose: "Ler integralmente cada contrato físico relacionado; ele é autoridade do domínio."
  - order: 8
    path: "código e testes do HEAD"
    purpose: "Provar capacidade existente; documentação futura não é implementação."

canonical_artifacts:
  product_contract: "hack/PRD.md"
  analyst_index: "hack/ANALYST.md"
  integrated_semantic_map: "hack/analysis.md"
  domain_analysts: "hack/domains/ANALYST-*.md"
  integrated_technical_map: "hack/BUILD.md"
  domain_builds: "hack/domains/BUILD-*.md"
  execution_state: "hack/status.json"
  progress_receipt: "hack/progress.md"
  review_tracker: ".context/review/STATUS.md"
  future_warlog: "hack/WARLOG.md"
  future_writing_plan: "hack/minispecs/<id>/writing-plan.md"

context_map:
  manifest.yaml: "Entrada, leitura e autoridade."
  product.yaml: "Problema, fluxo, fronteiras e DoD."
  workflow.yaml: "Método até Writing Plans, implementação e QA."
  architecture.yaml: "Inventário comprovado do HEAD."
  review/STATUS.md: "Único tracker de research, recon e review."

authority:
  levels:
    - order: 1
      source: "Marco e hack/PRD.md aprovado"
    - order: 2
      source: "decisões canônicas no Analyst de domínio dono"
    - order: 3
      source: "Build de domínio dono"
    - order: 4
      source: "Writing Plan da fatia"
    - order: 5
      source: "código e testes do HEAD"
    - order: 6
      source: "hubs e documentação auxiliar"
  hubs: "hack/ANALYST.md, hack/analysis.md e hack/BUILD.md indexam e integram; nunca superam um owner de domínio."
  conflict_rule: "Pare, nomeie as fontes conflitantes e corrija o contrato. Nunca escolha silenciosamente."

workflow:
  current_phase: "documentation_reconciliation"
  sequence:
    - "PRD aprovado"
    - "Analysts de domínio canônicos"
    - "Builds de domínio canônicos"
    - "hubs integrados"
    - "review final independente"
    - "Warlog exaustivo corta fatias"
    - "Writing Plan da fatia"
    - "TDD RED"
    - "implementação"
    - "QA"
  no_separate_spec: true
  no_individual_signature_gates: true

limits:
  context_role: ".context organiza; não substitui PRD, Analysts ou Builds."
  flowkit_warning: "Contexto herdado do FlowKit é histórico, nunca verdade do Antessala."
  donor_warning: "DietFlow e EscalaFlow são doadores; regra de domínio só atravessa quando o Build Antessala a adapta explicitamente."
  raw_review_rule: "Resposta externa é material de trabalho. Corrija o owner canônico e o tracker; não arquive a resposta bruta."
  documentation_rule: "Não criar fonte paralela quando existe owner canônico."
